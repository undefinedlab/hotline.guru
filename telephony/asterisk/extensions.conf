; Inbound calls → FastAGI voice agent on orchestrator :4573
; Docker: use host.docker.internal; native: 127.0.0.1

[from-trunk]
exten => _X.,1,NoOp(hotline.guru voice)
 same => n,Answer()
 same => n,AGI(agi://${ENV(PHONE_AGI_HOST):host.docker.internal}:4573)
 same => n,Hangup()

; Softphone main line
exten => hotline,1,NoOp(hotline.guru softphone)
 same => n,Answer()
 same => n,AGI(agi://${ENV(PHONE_AGI_HOST):host.docker.internal}:4573)
 same => n,Hangup()

; Dial-a-rate — free, no account
exten => rate,1,NoOp(dial-a-rate)
 same => n,Answer()
 same => n,AGI(agi://${ENV(PHONE_AGI_HOST):host.docker.internal}:4573,rate)
 same => n,Hangup()

; Flash / missed-call balance — point a DID here, or softphone dial flash
; (Do NOT use a global h-extension — that would SMS on every hangup.)
exten => flash,1,NoOp(flash balance)
 same => n,Ringing()
 same => n,Wait(2)
 same => n,Answer()
 same => n,AGI(agi://${ENV(PHONE_AGI_HOST):host.docker.internal}:4573,flash)
 same => n,Hangup()
