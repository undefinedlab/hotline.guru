; Asterisk PJSIP — cheap inbound SIP (Zadarma / Telnyx)
; Fill SIP_* from .env / secrets. Do NOT commit real passwords.
;
; Replace EXTERNAL_IP with your public IP (SIP + RTP NAT).
; Forward UDP 5060 and 10000-10099 to this host.

[udp-transport]
type=transport
protocol=udp
bind=0.0.0.0
local_net=172.16.0.0/12
; For lab/softphone, leave unset or set to LAN IP. For public SIP trunk, set real public IP.
; external_signaling_address=203.0.113.10
; external_media_address=203.0.113.10

; --- Trunk (example: Zadarma PBX) ---
[trunk]
type=registration
transport=udp-transport
outbound_auth=trunk_auth
server_uri=sip:pbx.zadarma.com
client_uri=sip:SIP_USER@pbx.zadarma.com
retry_interval=60
expiration=120
contact_user=SIP_USER

[trunk_auth]
type=auth
auth_type=userpass
username=SIP_USER
password=SIP_PASSWORD

[trunk]
type=aor
contact=sip:pbx.zadarma.com

[trunk]
type=endpoint
transport=udp-transport
context=from-trunk
disallow=all
allow=ulaw
allow=alaw
outbound_auth=trunk_auth
aors=trunk
from_user=SIP_USER
direct_media=no
rtp_symmetric=yes

[trunk]
type=identify
endpoint=trunk
match=pbx.zadarma.com

; --- Local softphone for lab tests (no SIP trunk needed) ---
[hotline-auth]
type=auth
auth_type=userpass
username=hotline
password=hotline-lab

[hotline]
type=aor
max_contacts=3

[hotline]
type=endpoint
transport=udp-transport
context=from-trunk
disallow=all
allow=ulaw
allow=alaw
auth=hotline-auth
aors=hotline
direct_media=no
